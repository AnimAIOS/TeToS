[package]
name = "teto-tss"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Kasane Teto as a Service: an OpenAI-compatible TTS endpoint powered by UTAU voicebanks. No neural models were harmed."
readme = "README.md"
keywords = ["tts", "utau", "vocaloid", "openai-compatible", "teto"]
categories = ["multimedia::audio", "web-programming::http-server"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hound = "3.5"
libc = "0.2"
mp3lame-encoder = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
strip = true
